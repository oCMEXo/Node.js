<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="card">
    <div class="row" style="justify-content: space-between;">
      <div>
        <h1 style="margin-bottom: 4px;">Основное приложение</h1>
        <div class="small">Protected area: Articles</div>
      </div>
      <button id="logout">Выйти</button>
    </div>

    <div class="grid">
      <div>
        <h2 style="margin: 8px 0 6px; font-size: 18px;">Новая статья</h2>
        <form id="createForm">
          <label>Заголовок</label>
          <input id="title" maxlength="120" required />
          <label>Текст</label>
          <textarea id="body" maxlength="5000" required></textarea>
          <div class="row">
            <button type="submit">Сохранить</button>
            <button id="refresh" type="button">Обновить список</button>
          </div>
          <div id="alert" class="alert"></div>
        </form>
      </div>

      <div>
        <h2 style="margin: 8px 0 6px; font-size: 18px;">Мои статьи</h2>
        <div id="list" class="list"></div>
      </div>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
