<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Articles API Extension</title>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f3f4f6; }
      header { background: #111827; color: white; padding: 1rem 1.5rem; }
      header h1 { margin: 0 0 .25rem 0; font-size: 1.4rem; }
      header p { margin: 0; font-size: .9rem; color: #e5e7eb; }
      main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem 2rem; }
      .error { background: #fee2e2; color: #991b1b; padding: .5rem .8rem; border-radius: .5rem; margin-bottom: .75rem; font-size: .9rem; }
      .article-list { display: flex; flex-direction: column; gap: .75rem; }
      .article-card { background: white; border-radius: .75rem; padding: .75rem 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .article-header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; margin-bottom: .25rem; }
      .article-title { font-size: 1rem; font-weight: 600; margin: 0; }
      .article-id { font-size: .8rem; color: #6b7280; }
      .article-content { font-size: .9rem; white-space: pre-wrap; margin-bottom: .5rem; }
      .article-actions { display: flex; gap: .3rem; flex-wrap: wrap; }
      button { border-radius: .5rem; border: none; padding: .35rem .7rem; cursor: pointer; font-size: .85rem; }
      button.primary { background: #2563eb; color: white; }
      button.secondary { background: #e5e7eb; color: #111827; }
      button.danger { background: #dc2626; color: white; }
      form#create-article-form { background: white; padding: .75rem 1rem; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 1rem; display: flex; flex-direction: column; gap: .5rem; }
      form#create-article-form input[type="text"],
      form#create-article-form textarea { width: 100%; padding: .4rem .6rem; border-radius: .5rem; border: 1px solid #d1d5db; font-size: .95rem; }
      form#create-article-form textarea { resize: vertical; min-height: 70px; }
      .empty-state { font-size: .9rem; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <h1>Articles</h1>
      <p>Assignment 3: API extension (edit and delete)</p>
    </header>
    <main>
      <div id="error" class="error" style="display:none;"></div>

      <section>
        <h2>Create New Article</h2>
        <form id="create-article-form">
          <input id="new-title" type="text" placeholder="Title" />
          <textarea id="new-content" placeholder="Content"></textarea>
          <button type="submit" class="primary">Create</button>
        </form>
      </section>

      <section>
        <h2>All Articles</h2>
        <div id="articles-list" class="article-list"></div>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
