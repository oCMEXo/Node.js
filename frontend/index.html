<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Articles — Attachments & Notifications</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
      body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; background: #f3f4f6; }
      header { background: #111827; color: white; padding: 1rem 1.5rem; }
      header h1 { margin: 0 0 .25rem 0; font-size: 1.4rem; }
      header p { margin: 0; font-size: .9rem; color: #e5e7eb; }
      main { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
      .toast-container { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }
      .toast { background: #111827; color: white; padding: .5rem .8rem; border-radius: .5rem; margin-bottom: .3rem; font-size: .85rem; box-shadow: 0 4px 6px rgba(0,0,0,.2); }
      .article-card { background: white; border-radius: .75rem; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
      .article-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; gap: .5rem; }
      .article-title { margin: 0; font-size: 1rem; font-weight: 600; }
      .article-id { font-size: .8rem; color: #6b7280; }
      .article-content { margin-bottom: .5rem; font-size: .9rem; white-space: pre-wrap; }
      .attachments { margin-bottom: .5rem; }
      .attachments-title { font-size: .85rem; font-weight: 600; margin-bottom: .25rem; }
      .attachments-list { display: flex; gap: .5rem; flex-wrap: wrap; }
      .attachment-item { border: 1px solid #e5e7eb; border-radius: .5rem; padding: .3rem; background: #f9fafb; font-size: .8rem; text-align: center; max-width: 140px; }
      .attachment-item a { text-decoration: none; color: #111827; }
      .attachment-item img { max-width: 120px; max-height: 120px; display: block; margin-bottom: .25rem; border-radius: .25rem; }
      .article-actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin-top: .5rem; }
      button { border-radius: .5rem; border: none; padding: .4rem .7rem; cursor: pointer; font-size: .85rem; }
      button.primary { background: #2563eb; color: white; }
      button.secondary { background: #e5e7eb; color: #111827; }
      button.danger { background: #dc2626; color: white; }
      form#create-article-form { background: white; padding: 1rem; border-radius: .75rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 1.5rem; display: flex; flex-direction: column; gap: .5rem; }
      form#create-article-form input[type="text"],
      form#create-article-form textarea { width: 100%; padding: .4rem .6rem; border-radius: .5rem; border: 1px solid #d1d5db; font-size: .95rem; }
      form#create-article-form textarea { min-height: 80px; resize: vertical; }
      form#create-article-form button { align-self: flex-start; }
      .empty-state { font-size: .9rem; color: #6b7280; }
      .attachment-upload { display: flex; gap: .3rem; align-items: center; font-size: .8rem; }
      .attachment-upload input[type="file"] { font-size: .8rem; }
    </style>
  </head>
  <body>
    <header>
      <h1>Articles</h1>
      <p>Attachments and real-time notifications via WebSockets</p>
    </header>

    <div id="notifications" class="toast-container"></div>

    <main>
      <section>
        <h2>Create New Article</h2>
        <form id="create-article-form">
          <input id="new-title" type="text" placeholder="Title" />
          <textarea id="new-content" placeholder="Content"></textarea>
          <button type="submit" class="primary">Create</button>
        </form>
      </section>

      <section>
        <h2>All Articles</h2>
        <div id="articles-list"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
