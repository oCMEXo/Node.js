<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Articles with Attachments & Notifications</title>
</head>
<style>
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        background: #f4f5f7;
        color: #222;
    }

    header {
        background: #24292e;
        color: #fff;
        padding: 16px 24px;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
    }

    header p {
        margin: 4px 0 0;
        opacity: 0.8;
    }

    main {
        max-width: 900px;
        margin: 24px auto;
        padding: 0 16px 40px;
    }

    section {
        background: #fff;
        margin-bottom: 16px;
        padding: 16px;
        border-radius: 10px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    h2 {
        margin-top: 0;
    }

    #notifications {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 1000;
    }

    /* Toast notification */
    .toast {
        background: #24292e;
        color: #fff;
        padding: 10px 14px;
        margin-bottom: 8px;
        border-radius: 6px;
        font-size: 14px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transform: translateY(-10px);
        animation: toast-in 0.2s forwards;
    }

    @keyframes toast-in {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .article-card {
        border: 1px solid #e1e4e8;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
        background: #fafbfc;
    }

    .article-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .article-title {
        font-weight: 600;
        margin: 0;
    }

    .article-content {
        margin: 8px 0 12px;
        white-space: pre-wrap;
    }

    .attachments {
        margin-top: 8px;
    }

    .attachments h4 {
        margin: 0 0 4px;
    }

    .attachments-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .attachment-item {
        border: 1px solid #e1e4e8;
        border-radius: 6px;
        padding: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
    }

    .attachment-item img {
        max-width: 120px;
        max-height: 80px;
        display: block;
        margin-bottom: 4px;
        border-radius: 4px;
    }

    .article-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
        flex-wrap: wrap;
    }

    button {
        border: none;
        border-radius: 4px;
        padding: 6px 10px;
        cursor: pointer;
        background: #2ea44f;
        color: #fff;
        font-size: 14px;
    }

    button.secondary {
        background: #0366d6;
    }

    button.danger {
        background: #d73a49;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    input[type="text"],
    textarea {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #d1d5da;
    }

    textarea {
        min-height: 70px;
        resize: vertical;
    }

    input[type="file"] {
        font-size: 13px;
    }

</style>
<body>
<header>
    <h1>Articles</h1>
    <p>Attachments + Real-time notifications via WebSockets</p>
</header>

<main>
    <section id="notifications"></section>

    <section id="create-article">
        <h2>Create New Article</h2>
        <form id="create-article-form">
            <input type="text" id="new-title" placeholder="Title" required />
            <textarea id="new-content" placeholder="Content" required></textarea>
            <button type="submit">Create</button>
        </form>
    </section>

    <section id="articles-section">
        <h2>All Articles</h2>
        <div id="articles-list"></div>
    </section>
</main>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>
</body>
</html>
